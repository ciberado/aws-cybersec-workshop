services:
  app:
    build: .
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3002
    volumes:
      - ./data:/app/data:rw
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"  # Use actual user from .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
